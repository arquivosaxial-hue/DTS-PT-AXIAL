  <script>
    // Registra o service worker (modo offline). Falha silenciosa se não suportado.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").then(function(reg){
          window.__swReg = reg;
          // detecta versão nova baixada enquanto o app está aberto
          reg.addEventListener("updatefound", function(){
            var novo = reg.installing;
            if(!novo) return;
            novo.addEventListener("statechange", function(){
              if(novo.state === "installed" && navigator.serviceWorker.controller){
                window.dispatchEvent(new Event("sw-update"));
              }
            });
          });
        }).catch(()=>{});
      });
      // ao voltar para o app, procura atualização
      document.addEventListener("visibilitychange", function(){
        if(!document.hidden && window.__swReg){ try{ window.__swReg.update(); }catch(e){} }
      });
    }
    // ---- Aviso de nova versão ----
    // Faixa em HTML puro (fora do React) para não interferir na tela do app.
    // NÃO recarrega sozinho: se o operador estiver preenchendo um documento,
    // um reload automático perderia o que ele digitou. Ele decide quando atualizar.
    function mostrarAvisoVersao() {
      if (document.getElementById('faixa-atualizar')) return;
      var f = document.createElement('div');
      f.id = 'faixa-atualizar';
      f.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#185FA5;color:#fff;'
        + 'padding:12px 14px;display:flex;align-items:center;gap:12px;font:600 14px system-ui,sans-serif;'
        + 'box-shadow:0 -2px 12px rgba(0,0,0,.25)';
      var t = document.createElement('span');
      t.textContent = 'Nova versão disponível.';
      t.style.flex = '1';
      var b = document.createElement('button');
      b.textContent = 'Atualizar';
      b.style.cssText = 'background:#fff;color:#185FA5;border:none;border-radius:8px;padding:8px 16px;'
        + 'font:700 14px system-ui,sans-serif;cursor:pointer';
      b.onclick = function () {
        if (navigator.serviceWorker.controller) {
          try { navigator.serviceWorker.controller.postMessage('SKIP_WAITING'); } catch (e) {}
        }
        location.reload();
      };
      var x = document.createElement('button');
      x.textContent = 'Agora não';
      x.style.cssText = 'background:transparent;color:rgba(255,255,255,.85);border:none;'
        + 'font:600 13px system-ui,sans-serif;cursor:pointer';
      x.onclick = function () { f.remove(); };
      f.appendChild(t); f.appendChild(x); f.appendChild(b);
      document.body.appendChild(f);
    }
    window.addEventListener('sw-update', mostrarAvisoVersao);

  </script>

// PAINEL ADM (cortina de senha) - lista DTS por período e baixa PDFs
// ============================================================
// Aviso: isto é uma "cortina" visual, não proteção forte.

// Devolve "YYYY-MM-DD" no FUSO LOCAL (não usa toISOString, que converte
// para UTC e joga o registro para o dia seguinte à noite no Brasil).
// Lê TODOS os registros de uma consulta, em blocos de 1000.
// O Supabase devolve no máximo 1000 linhas por requisição, mesmo sem
// .limit() — sem paginar, os mais antigos somem em silêncio.
async function buscarTudo(montarQuery) {
  const TAM = 1000,
    MAX_BLOCOS = 50;
  let todos = [];
  for (let bloco = 0; bloco < MAX_BLOCOS; bloco++) {
    const de = bloco * TAM;
    const {
      data,
      error
    } = await montarQuery().range(de, de + TAM - 1);
    if (error) throw error;
    const lote = data || [];
    todos = todos.concat(lote);
    if (lote.length < TAM) break;
  }
  return todos;
}
function diaLocal(d) {
  const x = d ? new Date(d) : new Date();
  const mm = String(x.getMonth() + 1).padStart(2, "0");
  const dd = String(x.getDate()).padStart(2, "0");
  return x.getFullYear() + "-" + mm + "-" + dd;
}

// ===== IMPORTAÇÃO DO EFETIVO =====
// Lê CSV, não .xlsx. É uma decisão, não uma limitação: um leitor de xlsx é uma
// biblioteca nova de ~900 KB no app inteiro, com versão para fixar e hash SRI
// para manter, só para uma tela que o administrador usa uma vez por mês. No
// Excel: Arquivo → Salvar como → "CSV UTF-8 (delimitado por vírgulas)".
function separadorDe(linha) {
  // Excel em pt-BR grava com ponto-e-vírgula; o "CSV UTF-8" grava com vírgula.
  const c = (linha.match(/,/g) || []).length,
    pv = (linha.match(/;/g) || []).length;
  const tab = (linha.match(/\t/g) || []).length; // colado direto da planilha
  if (tab >= c && tab >= pv && tab > 0) return "\t";
  return pv > c ? ";" : ",";
}
function lerLinhaCSV(linha, sep) {
  const campos = [];
  let atual = "";
  let aspas = false;
  for (let i = 0; i < linha.length; i++) {
    const ch = linha[i];
    if (aspas) {
      if (ch === '"') {
        if (linha[i + 1] === '"') {
          atual += '"';
          i++;
        } else aspas = false;
      } else atual += ch;
    } else if (ch === '"') aspas = true;else if (ch === sep) {
      campos.push(atual);
      atual = "";
    } else atual += ch;
  }
  campos.push(atual);
  return campos.map(c => c.trim());
}

// Aceita os cabeçalhos como saem da planilha do RH, com ou sem acento.
function acharColuna(cabecalho, nomes) {
  const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
  for (const nome of nomes) {
    const i = cabecalho.findIndex(h => norm(h) === norm(nome));
    if (i >= 0) return i;
  }
  return -1;
}

// Nomes que a coluna pode ter na planilha do RH. O arquivo real da Axial chama a
// matrícula de "Funcionário" e o nome de "Nome do Funcionário" — nada parecido com
// o "Código"/"Nome" que a gente esperava. Nomes novos entram nestas listas; o
// administrador não deve ter que renomear coluna para importar.
const COL_CODIGO = ["Código", "Codigo", "Matrícula", "Matricula", "Funcionário", "Funcionario", "Chapa", "Registro"];
const COL_NOME = ["Nome do Funcionário", "Nome do Funcionario", "Nome Completo", "Nome", "Colaborador", "Funcionário Nome"];
const COL_FUNCAO = ["Função", "Funcao", "Cargo", "Descrição do Cargo", "Descricao do Cargo"];
const COL_SITUACAO = ["Situação", "Situacao", "Status"];

// .xls e .xlsx são formatos binários. Lidos como texto viram caracteres de
// controle e U+FFFD — foi o que apareceu na primeira tentativa de importar, um
// borrão vermelho que não dizia o que fazer. Detectar dá para avisar direito.
function pareceBinario(texto) {
  const amostra = String(texto || "").slice(0, 2000);
  if (!amostra) return false;
  const ruins = (amostra.match(/[\u0000-\u0008\u000e-\u001f\ufffd]/g) || []).length;
  return ruins > amostra.length * 0.05;
}
function lerPlanilhaEfetivo(texto) {
  if (pareceBinario(texto)) return {
    erro: "Isto é um arquivo .xls ou .xlsx, que é binário e não dá para ler como texto. " + "O jeito mais rápido: abra a planilha no Excel, selecione as células (Ctrl+A), " + "copie (Ctrl+C) e cole aqui no campo de texto. Não precisa salvar como CSV."
  };
  const linhas = String(texto || "").replace(/\r/g, "").split("\n").filter(l => l.trim());
  if (linhas.length < 2) return {
    erro: "A planilha precisa do cabeçalho e ao menos uma linha."
  };

  // O cabeçalho nem sempre é a primeira linha: exportação de RH costuma trazer
  // título e data em cima. Procura nas 10 primeiras a linha que tem matrícula E nome.
  let iCab = -1,
    sep = ",",
    iCod = -1,
    iNom = -1,
    iFun = -1,
    iSit = -1;
  for (let i = 0; i < Math.min(10, linhas.length); i++) {
    const s = separadorDe(linhas[i]);
    const c = lerLinhaCSV(linhas[i], s);
    const cod = acharColuna(c, COL_CODIGO),
      nom = acharColuna(c, COL_NOME);
    if (cod >= 0 && nom >= 0) {
      iCab = i;
      sep = s;
      iCod = cod;
      iNom = nom;
      iFun = acharColuna(c, COL_FUNCAO);
      iSit = acharColuna(c, COL_SITUACAO);
      break;
    }
  }
  if (iCab < 0) {
    const visto = lerLinhaCSV(linhas[0], separadorDe(linhas[0])).join(" | ").slice(0, 180);
    return {
      erro: "Não achei a coluna da matrícula e a do nome. Aceito \"Código\", " + "\"Matrícula\" ou \"Funcionário\" para a matrícula, e \"Nome\" ou " + "\"Nome do Funcionário\" para o nome. Primeira linha lida: " + visto
    };
  }
  const ok = [],
    ruins = [];
  const vistos = new Set();
  for (let i = iCab + 1; i < linhas.length; i++) {
    const c = lerLinhaCSV(linhas[i], sep);
    // Matrícula é TEXTO: '001104' com zeros à esquerda. Se o Excel tiver comido
    // os zeros, o vínculo com a planilha do RH quebra — e não há como adivinhar.
    const codigo = (c[iCod] || "").replace(/^'/, "").trim();
    const nome = (c[iNom] || "").trim();
    if (!codigo && !nome) continue;
    if (!codigo || !nome) {
      ruins.push({
        linha: i + 1,
        motivo: "código ou nome em branco"
      });
      continue;
    }
    if (vistos.has(codigo)) {
      ruins.push({
        linha: i + 1,
        motivo: "código " + codigo + " repetido na planilha"
      });
      continue;
    }
    vistos.add(codigo);
    const sitBruta = (iSit >= 0 ? c[iSit] || "" : "").toLowerCase();
    const situacao = /desligad|demitid|inativ/.test(sitBruta) ? "desligado" : /afastad|licen/.test(sitBruta) ? "afastado" : "ativo";
    // Só três campos atravessam para o banco. A planilha do RH traz CPF, salário
    // e admissão; nada disso tem serventia num documento de segurança, e coletar
    // o que não se usa é o oposto do que a LGPD pede (ver 2.5).
    ok.push({
      codigo,
      nome,
      funcao: iFun >= 0 ? (c[iFun] || "").trim() : "",
      situacao
    });
  }

    linhas: ok,
    ruins

}

      // todos os caminhos citados por algum documento, incluindo os da lixeira
      const emUso = new Set();
      for (const tabela of ["dts", "pt"]) {
        const dados = await buscarTudo(() => supa.from(tabela).select("pdf_path"));
        (dados || []).forEach(r => r.pdf_path && emUso.add(r.pdf_path));
      }
      const soltos = objetos.filter(o => !emUso.has(o));
      setOrfaos(soltos);
      setMsg(soltos.length ? soltos.length + " arquivo(s) sem documento correspondente." : "Nenhum PDF órfão. O bucket está limpo.");
    } catch (e) {
      setMsg("Erro ao procurar órfãos: " + e.message);
    } finally {
      setCarregando(false);
    }
  }
  async function apagarOrfaos() {
    if (!orfaos || !orfaos.length) return;
    if (!window.confirm("Apagar definitivamente " + orfaos.length + " arquivo(s) do Storage?\n\n" + "Eles não têm nenhum documento apontando para si. Esta ação não tem volta.")) return;
    setLimpando(true);
    setMsg("");
    try {
      // em lotes: a API do Storage tem limite por chamada
      for (let i = 0; i < orfaos.length; i += 100) {
        const {
          error
        } = await supa.storage.from("dts-pdfs").remove(orfaos.slice(i, i + 100));
        if (error) throw error;
      }
      setMsg(orfaos.length + " arquivo(s) apagados.");
      setOrfaos([]);
    } catch (e) {
      setMsg("Erro ao apagar: " + e.message);
    } finally {
      setLimpando(false);
    }
  }

  // Um só lugar decide o que os filtros fazem — a listagem, o CSV e o envio à
  // lixeira usam os TRÊS o mesmo. Antes o "enviar período à lixeira" ignorava
  // filtros que a tela mostrava, e apagava mais do que estava na frente de quem
  // clicou. Aqui isso não pode voltar a acontecer por descuido.
  function selecaoComFiltros() {
    // o filtro por pessoa exige juntar a tabela de colaboradores: !inner devolve
    // só os documentos que têm alguém batendo com a busca
    return colabFiltro.trim() ? cfg.select + "," + cfg.colab + "!inner(codigo,nome)" : cfg.select;
  }
  function aplicarFiltros(q) {
    if (de) q = q.gte("data_atividade", de);
    if (ate) q = q.lte("data_atividade", ate);
    if (cfg.filtroTipo && tipoFiltro) q = q.eq("tipo", tipoFiltro);
    // OS parcial: a revisão vira sufixo (" Rev.01"), então igualdade não serve
    if (osFiltro.trim()) q = q.ilike("numero_os", "%" + osFiltro.trim() + "%");
    if (cfg.filtroAtividade && ativFiltro) q = q.eq("atividade", ativFiltro);
    const alvo = colabFiltro.trim();
    if (alvo) {
      // só dígitos = matrícula; qualquer outra coisa = nome
      q = /^[0-9]+$/.test(alvo) ? q.ilike(cfg.colab + ".codigo", "%" + alvo + "%") : q.ilike(cfg.colab + ".nome", "%" + alvo + "%");
    }
    return q;
  }
  function resumoFiltros() {
    const partes = [];
    if (de || ate) partes.push("período " + (de || "início") + " a " + (ate || "hoje"));
    if (cfg.filtroTipo && tipoFiltro) partes.push("tipo " + tipoFiltro);
    if (osFiltro.trim()) partes.push("OS contendo \"" + osFiltro.trim() + "\"");
    if (cfg.filtroAtividade && ativFiltro) partes.push("serviço \"" + ativFiltro + "\"");
    if (colabFiltro.trim()) partes.push("colaborador \"" + colabFiltro.trim() + "\"");
    return partes.length ? partes.join(", ") : "sem filtro nenhum";
  }
  function limparFiltros() {
    setDe("");
    setAte("");
    setTipoFiltro("");
    setOsFiltro("");
    setColabFiltro("");
    setAtivFiltro("");
  }

  // ---- RELATÓRIO POR COLABORADOR (CSV) ----
  // O artefato que a defesa trabalhista pede: uma linha por pessoa por documento,
  // com matrícula, data, OS e serviço. Sai do mesmo filtro que está na tela.
  async function baixarCSV() {
    // Sem barra: aqui não há laço por documento para medir — é uma consulta
    // paginada e a montagem do texto. O aviso evita o clique repetido.
    setCarregando(true);
    setMsg("Buscando os dados…");
    try {
      const montar = () => {
        // aqui a junção é sempre necessária: o CSV é POR pessoa
        const sel = cfg.select + "," + cfg.colab + (colabFiltro.trim() ? "!inner" : "") + "(codigo,nome,ordem)";
        // 'id' entra como desempate: a paginação de 1000 em 1000 precisa de uma
        // ordem estável, e num só dia há dezenas de documentos com a mesma data —
        // sem desempate, o banco pode devolver a mesma linha duas vezes e pular outra.
        let q = supa.from(cfg.tabela).select(sel).is("excluido_em", null).order("data_atividade", {
          ascending: true
        }).order("id", {
          ascending: true
        });
        return aplicarFiltros(q);
      };
      const docs = await buscarTudo(montar);
      if (!docs || !docs.length) {
        setMsg("Nada a exportar com os filtros atuais.");
        return;
      }
      const esc = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
      const cab = ["Matricula", "Colaborador", "Data", "OS", "Documento", "Servico", "Local", "Lider"];
      const linhas = [cab.map(esc).join(";")];
      let semNinguem = 0;
      for (const d of docs) {
        const equipe = (d[cfg.colab] || []).slice().sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
        if (!equipe.length) {
          semNinguem++;
          continue;
        }
        for (const c of equipe) {
          linhas.push([c.codigo || "", c.nome || "", d.data_atividade || (d.created_at || "").slice(0, 10), d.numero_os || "", cfg.rotulo + (d.tipo ? " " + d.tipo : ""), d[cfg.colTitulo] || "", d[cfg.colLocal] || "", d[cfg.colLider] || ""].map(esc).join(";"));
        }
      }
      // BOM: sem ele o Excel abre "João" como "JoÃ£o"
      const blob = new Blob(["\ufeff" + linhas.join("\r\n")], {
        type: "text/csv;charset=utf-8"
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "relatorio_" + cfg.prefixo.toLowerCase() + "_" + diaLocal() + ".csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setMsg(linhas.length - 1 + " linha(s) exportadas de " + docs.length + " documento(s)." + (semNinguem ? " " + semNinguem + " documento(s) sem equipe registrada ficaram de fora." : ""));
    } catch (e) {
      setMsg("Erro ao gerar o relatório: " + e.message);
    } finally {
      setCarregando(false);
    }
  }
  async function buscar(lixeira) {
    const naLixeira = lixeira === undefined ? verLixeira : lixeira;
    setCarregando(true);
    setMsg("");
    try {
      const montar = () => {
        let q = supa.from(cfg.tabela).select(selecaoComFiltros());
        // a lixeira é o mesmo registro com excluido_em preenchido
        q = naLixeira ? q.not("excluido_em", "is", null) : q.is("excluido_em", null);
        q = q.order("created_at", {
          ascending: false
        });
        return aplicarFiltros(q);
      };
      const data = await buscarTudo(montar); // paginado: sem limite de 1000
      setLista(data || []);
      if (!data || !data.length) setMsg(naLixeira ? "A lixeira está vazia no período." : "Nenhum registro encontrado no período.");
    } catch (e) {
      setMsg("Erro: " + e.message);
    } finally {
      setCarregando(false);
    }
  }

  // "permission denied for table X" é erro de GRANT, não de policy: a policy
  // filtra linhas, não concede privilégio. Sem esta tradução o administrador lê
  // uma mensagem do Postgres e não tem como saber o que fazer.
  function explicarErro(e) {
    const m = String(e && e.message || e);
    if (/permission denied for table/i.test(m)) {
      return m + " — falta o privilégio de exclusão no banco. Rode banco/06-exclusao-definitiva.sql.";
    }
    return m;
  }

  // ---- APAGAR UM ITEM DA LIXEIRA ----
  // Mesma destruição do "Esvaziar", em um registro só. Aqui a confirmação é um
  // confirm() nomeando o documento, não a digitação de APAGAR: a fricção tem que
  // ser proporcional ao estrago, e um item identificado na tela é bem menor que
  // um lote definido por filtro.
  async function apagarDefinitivo(item) {
    const desc = (item[cfg.colTitulo] || "(sem descrição)") + " — OS " + (item.numero_os || "-") + " — " + (item.data_atividade || (item.created_at || "").slice(0, 10));
    if (!window.confirm("APAGAR DEFINITIVAMENTE este registro?\n\n" + desc + "\n\nO documento, a equipe, o PDF e as fotos serão apagados e NÃO poderão ser " + "recuperados. Se quiser apenas tirá-lo da lixeira, use \"Restaurar\".")) return;
    setCarregando(true);
    setMsg("");
    try {
      // as fotos precisam ser lidas ANTES: depois do delete, o caminho some junto
      const {
        data: eq
      } = await supa.from(cfg.colab).select("foto_path").eq(cfg.fk, item.id);
      const fotos = (eq || []).map(c => c.foto_path).filter(Boolean);
      const {
        error
      } = await supa.from(cfg.tabela).delete().eq("id", item.id);
      if (error) throw error;
      if (item.pdf_path) await supa.storage.from("dts-pdfs").remove([item.pdf_path]);
      if (fotos.length) await supa.storage.from("rubricas").remove(fotos);
      setLista(l => l.filter(x => x.id !== item.id));
      setMsg("Registro apagado definitivamente" + (item.pdf_path ? " (PDF removido)" : "") + (fotos.length ? " · " + fotos.length + " foto(s) removidas" : "") + ".");
    } catch (e) {
      setMsg("Erro ao apagar: " + explicarErro(e));
    } finally {
      setCarregando(false);
    }
  }

  // ---- ESVAZIAR A LIXEIRA (exclusão definitiva) ----
  // A única operação do app que destrói documento de segurança. Por isso:
  //   1) só existe DENTRO da lixeira — o registro já passou por uma exclusão antes;
  //   2) respeita os filtros da tela, como todo o resto (aplicarFiltros);
  //   3) exige digitar APAGAR, porque um "OK" no susto é fácil demais;
  //   4) apaga o registro ANTES dos arquivos. Se a ordem fosse inversa e o banco
  //      falhasse, sobraria documento apontando para um PDF que não existe mais —
  //      pior do que arquivo órfão, que o "Procurar PDFs órfãos" ainda acha.
  // Os colaboradores somem junto por cascade da chave estrangeira.
  async function esvaziarLixeira() {
    setCarregando(true);
    setMsg("");
    try {
      const montar = () => {
        const sel = colabFiltro.trim() ? "id,pdf_path," + cfg.colab + "!inner(codigo,nome,foto_path)" : "id,pdf_path," + cfg.colab + "(foto_path)";
        let q = supa.from(cfg.tabela).select(sel).not("excluido_em", "is", null);
        return aplicarFiltros(q);
      };
      const alvos = await buscarTudo(montar);
      if (!alvos || !alvos.length) {
        setMsg("A lixeira está vazia com os filtros atuais.");
        return;
      }
      const conf = window.prompt("EXCLUSÃO DEFINITIVA de " + alvos.length + " registro(s) da lixeira.\n\n" + "Filtros em vigor: " + resumoFiltros() + "\n\n" + "Os documentos, as equipes, os PDFs e as fotos serão apagados e NÃO poderão ser " + "recuperados de nenhuma forma.\n\n" + "Para confirmar, digite APAGAR:");
      if (conf === null) return;
      if (conf.trim().toUpperCase() !== "APAGAR") {
        setMsg("Exclusão cancelada — o texto não confere.");
        return;
      }
      const pdfs = alvos.filter(a => a.pdf_path).map(a => a.pdf_path);
      const fotos = [];
      alvos.forEach(a => (a[cfg.colab] || []).forEach(c => {
        if (c.foto_path) fotos.push(c.foto_path);
      }));
      const ids = alvos.map(a => a.id);
      let apagados = 0;
      for (let i = 0; i < ids.length; i += 200) {
        const {
          error
        } = await supa.from(cfg.tabela).delete().in("id", ids.slice(i, i + 200));
        if (error) throw error;
        apagados += Math.min(200, ids.length - i);
      }
      // arquivos depois: falha aqui vira lixo recuperável, não documento quebrado
      let arquivosErro = 0;
      for (let i = 0; i < pdfs.length; i += 100) {
        const {
          error
        } = await supa.storage.from("dts-pdfs").remove(pdfs.slice(i, i + 100));
        if (error) arquivosErro++;
      }
      for (let i = 0; i < fotos.length; i += 100) {
        const {
          error
        } = await supa.storage.from("rubricas").remove(fotos.slice(i, i + 100));
        if (error) arquivosErro++;
      }
      setLista([]);
      setMsg(apagados + " registro(s) apagados definitivamente · " + pdfs.length + " PDF(s) e " + fotos.length + " foto(s) removidos" + (arquivosErro ? " · " + arquivosErro + " lote(s) de arquivo falharam — use \"Procurar PDFs órfãos\"" : "") + ".");
    } catch (e) {
      setMsg("Erro ao esvaziar a lixeira: " + explicarErro(e));
    } finally {
      setCarregando(false);
    }
  }

  // Tira o registro da lixeira. O PDF nunca foi apagado do Storage, então
  // restaurar devolve o documento inteiro.
  async function restaurar(item) {
    const desc = (item[cfg.colTitulo] || "(sem descrição)") + " — OS " + (item.numero_os || "-");
    if (!window.confirm("Restaurar este registro?\n\n" + desc + "\n\nEle volta a aparecer nas listagens normais.")) return;
    setCarregando(true);
    setMsg("");
    try {
      const {
        error
      } = await supa.from(cfg.tabela).update({
        excluido_em: null,
        excluido_por: null
      }).eq("id", item.id);
      if (error) throw error;
      setLista(l => l.filter(x => x.id !== item.id));
      setMsg("Registro restaurado.");
    } catch (e) {
      setMsg("Erro ao restaurar: " + e.message);
    } finally {
      setCarregando(false);
    }
  }
  async function baixar(item) {
    if (!item.pdf_path) {
      alert("Este documento não tem PDF salvo.");
      return;
    }
    try {
      const {
        data,
        error
      } = await supa.storage.from("dts-pdfs").download(item.pdf_path);
      if (error) throw error;
      const url = URL.createObjectURL(data);
      const a = document.createElement("a");
      a.href = url;
      a.download = item.pdf_path;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (e) {
      alert("Erro ao baixar: " + e.message);
    }
  }
  async function visualizar(item) {
    if (!item.pdf_path) {
      alert("Este documento não tem PDF salvo.");
      return;
    }
    try {
      const {
        data,
        error
      } = await supa.storage.from("dts-pdfs").download(item.pdf_path);
      if (error) throw error;
      const url = URL.createObjectURL(data);
      window.open(url, "_blank"); // abre o PDF numa nova aba
      // libera a memória depois de um tempo (a aba já carregou o arquivo)
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (e) {
      alert("Erro ao abrir: " + e.message);
    }
  }
  function baixarArquivo(blob, nome) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = nome;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    // o revoke imediato cancela o download em alguns navegadores
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  }

  // Busca a equipe de vários documentos de uma vez. Uma consulta por lote em
  // vez de uma por documento: com 440 DTS no mês, o segundo jeito seriam 440
  // idas ao servidor e o relatório levaria minutos.
  async function equipesDe(itens) {
    const mapa = {};
    for (let i = 0; i < itens.length; i += 200) {
      const ids = itens.slice(i, i + 200).map(x => x.id);
      const {
        data,
        error
      } = await supa.from(cfg.colab).select("codigo,nome,ordem,rubricado_em,foto_path,foto_motivo," + cfg.fk).in(cfg.fk, ids).order("ordem");
      if (error) throw error;
      (data || []).forEach(l => {
        (mapa[l[cfg.fk]] = mapa[l[cfg.fk]] || []).push(l);
      });
    }
    return mapa;
  }

  // ---- RELATÓRIO COM FOTOS ----
  // Documento SEPARADO do que vai para a Iguá, de propósito. Poderia ser uma
  // caixinha "incluir fotos" no botão existente, mas aí um clique errado manda
  // rosto de trabalhador para fora da empresa. Dois botões distintos tornam isso
  // um ato deliberado, não um descuido.
  async function baixarComFotos() {
    const comPdf = lista.filter(i => i.pdf_path);
    if (!comPdf.length) {
      alert("Nenhum documento com PDF no período.");
      return;
    }
    setCarregando(true);
    setMsg("");
    const t0 = Date.now();
    setProg({
      feitos: 0,
      total: comPdf.length,
      restante: null,
      rotulo: "Montando o relatório com fotos"
    });
    try {
      const {
        PDFDocument,
        StandardFonts,
        rgb
      } = PDFLib;
      const equipes = await equipesDe(comPdf);
      const unificado = await PDFDocument.create();
      const fonte = await unificado.embedFont(StandardFonts.Helvetica);
      const fonteN = await unificado.embedFont(StandardFonts.HelveticaBold);
      let ok = 0,
        falhas = 0,
        semFoto = 0,
        processados = 0;
      for (const item of comPdf) {
        try {
          const {
            data,
            error
          } = await supa.storage.from("dts-pdfs").download(item.pdf_path);
          if (error) throw error;
          const doc = await PDFDocument.load(await data.arrayBuffer());
          const pgs = await unificado.copyPages(doc, doc.getPageIndices());
          pgs.forEach(x => unificado.addPage(x));

          // a folha de fotos vem logo DEPOIS do documento a que pertence
          const equipe = equipes[item.id] || [];
          const pg = unificado.addPage([595.28, 841.89]);
          const A = 841.89;
          pg.drawText("REGISTRO FOTOGRÁFICO DA EQUIPE", {
            x: 50,
            y: A - 60,
            size: 14,
            font: fonteN,
            color: rgb(0.1, 0.23, 0.42)
          });
          pg.drawText(cfg.rotulo + "  ·  OS " + (item.numero_os || "-") + "  ·  " + (item.data_atividade || (item.created_at || "").slice(0, 10)), {
            x: 50,
            y: A - 80,
            size: 10,
            font: fonte,
            color: rgb(0.35, 0.35, 0.35)
          });
          pg.drawText(String(item[cfg.colTitulo] || "").slice(0, 90), {
            x: 50,
            y: A - 95,
            size: 10,
            font: fonte,
            color: rgb(0.35, 0.35, 0.35)
          });
          pg.drawLine({
            start: {
              x: 50,
              y: A - 105
            },
            end: {
              x: 545,
              y: A - 105
            },
            thickness: 0.8,
            color: rgb(0.8, 0.8, 0.8)
          });

          // grade 3 x 4: 12 fotos por página basta para a equipe de uma frente
          const COL = 3,
            LARG = 160,
            ALT = 150,
            X0 = 50,
            Y0 = A - 125;
          for (let k = 0; k < equipe.length; k++) {
            const c = equipe[k];
            const col = k % COL,
              lin = Math.floor(k / COL);
            const x = X0 + col * (LARG + 8),
              y = Y0 - lin * (ALT + 18);
            if (y < 80) break; // não cabe mais nesta página
            let desenhou = false;
            if (c.foto_path) {
              try {
                const {
                  data: img
                } = await supa.storage.from("rubricas").download(c.foto_path);
                if (img) {
                  const jpg = await unificado.embedJpg(await img.arrayBuffer());
                  const esc = Math.min(LARG / jpg.width, (ALT - 34) / jpg.height);
                  pg.drawImage(jpg, {
                    x,
                    y: y - jpg.height * esc,
                    width: jpg.width * esc,
                    height: jpg.height * esc
                  });
                  desenhou = true;
                }
              } catch (_) {/* foto ilegível: cai no aviso abaixo */}
            }
            if (!desenhou) {
              semFoto++;
              pg.drawRectangle({
                x,
                y: y - (ALT - 34),
                width: LARG,
                height: ALT - 34,
                borderColor: rgb(0.85, 0.85, 0.85),
                borderWidth: 0.8
              });
              const txt = c.foto_motivo === "recusou" ? "não autorizou" : c.foto_motivo === "area_risco" ? "área de risco" : c.foto_motivo === "indisponivel" ? "sem câmera" : "sem foto";
              pg.drawText(txt, {
                x: x + LARG / 2 - fonte.widthOfTextAtSize(txt, 9) / 2,
                y: y - (ALT - 34) / 2,
                size: 9,
                font: fonte,
                color: rgb(0.6, 0.6, 0.6)
              });
            }
            const base = y - (ALT - 34) - 12;
            pg.drawText(String(c.nome || "").slice(0, 26), {
              x,
              y: base,
              size: 8.5,
              font: fonteN,
              color: rgb(0.1, 0.1, 0.1)
            });
            pg.drawText((c.codigo ? "Mat. " + c.codigo : "sem matrícula") + (c.rubricado_em ? "  ·  " + new Date(c.rubricado_em).toLocaleTimeString("pt-BR", {
              hour: "2-digit",
              minute: "2-digit"
            }) : ""), {
              x,
              y: base - 10,
              size: 7.5,
              font: fonte,
              color: rgb(0.45, 0.45, 0.45)
            });
          }
          if (!equipe.length) {
            pg.drawText("Nenhum colaborador registrado neste documento.", {
              x: 50,
              y: A - 150,
              size: 10,
              font: fonte,
              color: rgb(0.55, 0.55, 0.55)
            });
          }
          ok++;
        } catch (e) {
          falhas++;

  useEffect(() => {
    (async () => {
      setPendentesGlobal((await filaListar()).length);

    const aoReconectar = () => sincronizarTudo();
    const aoMudarFila = e => setPendentesGlobal(e.detail && e.detail.restantes || 0);
    window.addEventListener("online", aoReconectar);
    window.addEventListener("fila-mudou", aoMudarFila);
    return () => {
      window.removeEventListener("online", aoReconectar);
      window.removeEventListener("fila-mudou", aoMudarFila);
    };
  }, []);

  // Sem isso, o voltar do celular fecha o app. Aqui ele recua uma tela por vez:
